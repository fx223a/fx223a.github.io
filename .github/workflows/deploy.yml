# ============================================================
# 自动部署到 GitHub Pages
# 每次 push 到 main 分支：先跑“占位自检”（还有待填内容就拒绝部署，
# 对应 CLAUDE.md 上线红线），通过后构建 Astro 并发布。
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 占位自检（上线红线）
        run: node scripts/check-placeholders.mjs
      - name: Build Astro site
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
